# golden-throw: a parity test fixture, not a plugin anyone installs.
# It subscribes to every core hook the golden cases' routes fire and throws
# from each one. The spec (06, 13) says a hook error is logged and the
# operation goes on with the previous subject, so with it on (--throwing-plugin)
# every golden case must still match: a broken plugin never changes or breaks
# a save.
specVersion: "0.1.0"
