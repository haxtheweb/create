# golden-noop: a parity test fixture, not a plugin anyone installs.
# It subscribes to every core hook the golden cases' routes fire and hands
# each hook its subject back unchanged. The golden suite runs with it on
# (--noop-plugin) to show that turning the plugin platform on, with a plugin
# that does nothing, changes nothing a site ends up with.
