name: build
on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base is another feature branch, not main)
  # must run the tests too, otherwise they merge with no CI signal.
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test-ubunttu:
    name: "${{ matrix.platform }}: node.js ${{ matrix.node-version }}"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
  # haxtheweb/issues#3116: the agent / CI path. Runs as root in a fresh
  # container with no TTY and no git identity, the context AI agents and
  # CI runners give the CLI, so a prompt or launched dev server shows up as
  # a hang and a missing identity shows up as a stack trace.
  agent-path:
    name: "agent path: no TTY, no git identity"
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Smoke tests
        env:
          CI: "true"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: npm run test:smoke
