name: External dependencies use JS builds
# Blocking: outside libraries are used through their JavaScript builds, never
# their TypeScript sources (AGENTS.md External Dependencies). Node 24 strips
# types by itself, so a .ts import can work locally and still break the
# no-compile-step promise. scripts/js-builds-check.mjs (standard library only)
# fails when a file under src/ imports a .ts / .tsx / .mts / .cts file or a
# package's src/ folder.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  js-builds:
    name: External dependencies use JS builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Self-test
        run: node scripts/js-builds-check.mjs --self-test
      - name: Check
        run: node scripts/js-builds-check.mjs
