name: Deploy HAX Site to GitHub Pages

# A HAX site has nothing to install or compile: the site is published as it
# is, with the ghpages:build script swapping in the CDN-loading index.html.
# Build and deploy share one job so only one runner has to start.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push replaces one still running
concurrency:
  group: "pages"
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # ghpages:build uses the CDN version of index.html and removes the
      # links (build, wc-registry.json) that only work on a HAX server.
      # Any other link left pointing outside the repo (dist, node_modules)
      # would stop the archive step, so those go too.
      - name: Prepare HAX site
        run: |
          npm run ghpages:build --if-present
          find . -xtype l -not -path './.git/*' -print -delete

      # What actions/upload-pages-artifact does, without listing every file
      # in the log and without compressing: a site is mostly images, which
      # don't shrink, so compressing costs more time than it saves.
      - name: Archive site
        run: |
          tar --dereference --hard-dereference \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
